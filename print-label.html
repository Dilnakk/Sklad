<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QR štítek – NIIMBOT B21S</title>

  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
  <script src="qr-mini.js"></script>
  <script src="https://unpkg.com/niimbot-web-bluetooth@2.6.0/src/niimbot.js"></script>
  <script src="app.js"></script>

  <style>
    body{
      background:#fff;
      color:#000;
    }

    .page{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:min(420px,100%);
      background:#fff;
      border:1px solid #ddd;
      border-radius:16px;
      padding:20px;
      box-shadow:0 2px 12px rgba(0,0,0,.08);
      text-align:center;
    }

    .preview-wrap{
      display:flex;
      justify-content:center;
      margin:16px 0;
    }

    #preview{
      width:240px;
      height:160px;
      background:#fff;
      border:1px solid #bbb;
      image-rendering:pixelated;
    }

    button{
      width:100%;
      margin-top:10px;
      padding:14px;
      border:0;
      border-radius:10px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
    }

    .primary{
      background:#111;
      color:#fff;
    }

    .secondary{
      background:#eee;
      color:#111;
    }

    button:disabled{
      opacity:.55;
      cursor:default;
    }

    #status{
      margin-top:14px;
      padding:12px;
      border-radius:10px;
      background:#eee;
      line-height:1.4;
    }

    #status.ok{background:#e6f5e6}
    #status.error{background:#ffe3e3}
    #status.warn{background:#fff0c9}
  </style>
</head>

<body>
<div class="page">
  <div class="card">
    <h2>QR štítek</h2>
    <div>NIIMBOT B21S · 30 × 20 mm</div>

    <div class="preview-wrap">
      <canvas id="preview" width="240" height="160"></canvas>
    </div>

    <button id="printBtn" class="primary">🖨️ Tisk NIIMBOT B21S</button>
    <button class="secondary" onclick="window.close()">Zavřít</button>

    <div id="status">Připravuji QR kód…</div>
  </div>
</div>

<script>
  const NIIMBOT_B21S_MODEL = {
    name_prefixes: ["B21"],
    task: "b1",
    density: 3,
    label_type: 1,
    speed: 1
  };

  const NIIMBOT_B21S_SIZE = {
    w_px: 240,
    h_px: 160,
    offset_y_px: 0,
    dpi: 203
  };

  const params = new URLSearchParams(location.search);
  const code = (params.get('code') || '').trim();

  const preview = document.getElementById('preview');
  const printBtn = document.getElementById('printBtn');
  const statusEl = document.getElementById('status');

  let printDataUrl = '';

  function setStatus(text, type='') {
    statusEl.textContent = text;
    statusEl.className = type;
  }

  function makeQrDataUrl(text) {
    return new Promise((resolve, reject) => {
      try {
        const svg = InventoryQR.toSvg(text, 4, 2);
        const blob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const img = new Image();

        img.onload = function() {
          URL.revokeObjectURL(url);

          const canvas = document.createElement('canvas');
          canvas.width = 240;
          canvas.height = 160;

          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Čistý QR bez textu.
          const qrSize = 148;
          const x = Math.round((canvas.width - qrSize) / 2);
          const y = Math.round((canvas.height - qrSize) / 2);

          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(img, x, y, qrSize, qrSize);

          resolve(canvas.toDataURL('image/png'));
        };

        img.onerror = function() {
          URL.revokeObjectURL(url);
          reject(new Error('QR obrázek se nepodařilo připravit.'));
        };

        img.src = url;
      } catch (e) {
        reject(e);
      }
    });
  }

  async function prepareLabel() {
    if (!code) {
      setStatus('Chybí kód položky.', 'error');
      printBtn.disabled = true;
      return;
    }

    try {
      // Ověříme, že kód existuje ve skladu.
      const r = await api('searchItem', {code});
      if (!r || !r.item) throw new Error('Položka nebyla nalezena.');

      printDataUrl = await makeQrDataUrl(r.item.kod || code);

      const img = new Image();
      img.onload = function() {
        const ctx = preview.getContext('2d');
        ctx.clearRect(0, 0, preview.width, preview.height);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, preview.width, preview.height);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0, preview.width, preview.height);
      };
      img.src = printDataUrl;

      setStatus('Štítek je připravený. Stiskni tisk.', 'ok');
      printBtn.disabled = false;
    } catch (e) {
      printBtn.disabled = true;
      setStatus('Chyba: ' + (e.message || e), 'error');
    }
  }

  async function printNiimbotLabel() {
    if (!printDataUrl) {
      setStatus('Štítek ještě není připravený.', 'error');
      return;
    }

    if (!window.Niimbot || !Niimbot.isSupported()) {
      setStatus('Tento prohlížeč nepodporuje Web Bluetooth. Použij Chrome nebo Edge.', 'error');
      return;
    }

    printBtn.disabled = true;
    printBtn.textContent = 'PŘIPOJUJI NIIMBOT…';
    setStatus('Vyber NIIMBOT B21S v okně Bluetooth.', 'warn');

    try {
      await Niimbot.printImage(printDataUrl, {
        model: NIIMBOT_B21S_MODEL,
        size: NIIMBOT_B21S_SIZE,
        copies: 1,
        density: 3,
        onProgress: function(p) {
          if (p && typeof p === 'object' && p.print != null) {
            setStatus('Tisk: ' + p.print + '%', 'warn');
          }
        }
      });

      setStatus('HOTOVO – QR štítek byl odeslán do NIIMBOT B21S.', 'ok');
      printBtn.textContent = '🖨️ VYTISKNOUT ZNOVU';
      printBtn.disabled = false;
    } catch (e) {
      console.error('NIIMBOT tisk:', e);
      setStatus('Tisk se nepodařil: ' + (e && e.message ? e.message : e), 'error');
      printBtn.textContent = '🖨️ ZKUSIT TISK ZNOVU';
      printBtn.disabled = false;
    }
  }

  printBtn.addEventListener('click', printNiimbotLabel);
  prepareLabel();
</script>
</body>
</html>
