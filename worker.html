<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sklad materiálu – pracovník</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="qr-mini.js"></script><script src="app.js" defer></script></head><body>
<header><div class="header-inner"><div class="brand"><h1>Sklad materiálu</h1><p id="who">Pracovník</p></div><div class="top-actions"><span id="conn" class="badge">Kontrola…</span><button class="small secondary" onclick="clearAuth();go('index.html')">Odhlásit zařízení</button></div></div></header>
<main class="container">
  <div class="nav"><button class="active" data-tab="search">🔎 Hledat</button><button data-tab="mine">📦 Můj stav</button></div>
  <section id="tab-search" class="section active">
    <div class="card"><h2>Najít položku</h2><div class="form-grid"><div><label>Kód položky</label><input id="searchCode" placeholder="D-0001 / AU-0001"></div><div style="display:flex;align-items:end"><button class="secondary" style="width:100%" onclick="openScanner(v=>{document.getElementById('searchCode').value=v;searchItem()})">📷 Skenovat QR</button></div></div><div class="actions"><button class="primary" onclick="searchItem()">🔎 Vyhledat</button></div><div id="searchStatus"></div><div id="searchResult"></div></div>
  </section>
  <section id="tab-mine" class="section"><div class="card"><h2>Můj stav</h2><div id="mineResult">Načítám…</div></div></section>
</main>
<script>
let me=null;
function itemText(item){
  const parts=[];
  if(item.druh)parts.push(item.druh);
  if(item.kategorie==='KÁMEN'){
    if(item.velikost)parts.push(item.velikost);
    if(item.barva)parts.push(item.barva);
    if(item.cistota)parts.push(item.cistota);
  }else{
    if(item.ryzost)parts.push(item.ryzost+'/1000');
    if(item.barva)parts.push(item.barva);
    if(item.forma)parts.push(item.forma);
  }
  return parts.join(' · ');
}

function renderItem(r){
  if(!r||!r.item)return '<div class="error-box">Položka nebyla nalezena.</div>';
  const i=r.item,metal=i.kategorie!=='KÁMEN',mine=r.mine||{pocet:0,jednotka:i.jednotka,celkemCt:0};
  const extra=metal?`<div class="grid grid-2" style="margin-top:12px"><div><div class="muted">Čisté Au</div><div class="qty">${i.cisteAuG===null?'—':num(i.cisteAuG,3)+' g'}</div></div><div><div class="muted">14k ekvivalent</div><div class="qty">${i.ekv14kG===null?'—':num(i.ekv14kG,3)+' g'}</div></div></div>`:'';
  const centralCt=Number(i.celkemCt)>0?`<div class="muted">${num(i.celkemCt)} ct</div>`:'';
  const mineCt=Number(mine.celkemCt)>0?`<div class="muted">${num(mine.celkemCt)} ct</div>`:'';
  return `<div class="item-card"><div class="item-code">${esc(i.kod)}</div><div class="item-meta">${esc(itemText(i))} · pozice ${esc(i.pozice||'—')}</div>${metal&&i.ryzost===null?'<div class="muted" style="margin-top:8px">Ryzost zatím není určena.</div>':''}${extra}<div class="grid grid-2" style="margin-top:12px"><div><div class="muted">Centrální sklad</div><div class="qty">${num(i.pocet)} ${esc(i.jednotka)}</div>${centralCt}</div><div><div class="muted">U mě</div><div class="qty">${num(mine.pocet||0)} ${esc(i.jednotka)}</div>${mineCt}</div></div><div class="actions"><button class="good" onclick="moveStock('TAKE','${esc(i.kod)}')">VZÍT ZE SKLADU</button><button class="secondary" onclick="moveStock('RETURN','${esc(i.kod)}')">VRÁTIT DO SKLADU</button></div><div id="moveBox"></div></div>`
}

async function searchItem(){const code=document.getElementById('searchCode').value.trim();if(!code){showStatus('searchStatus','Zadej nebo naskenuj kód.','error');return}showStatus('searchStatus','Hledám…');try{const r=await api('searchItem',{code});document.getElementById('searchResult').innerHTML=renderItem(r);showStatus('searchStatus','Položka nalezena.','ok')}catch(e){document.getElementById('searchResult').innerHTML='';showStatus('searchStatus','Chyba: '+e.message,'error')}}
async function moveStock(direction,code){const qty=prompt(direction==='TAKE'?'Kolik vzít?':'Kolik vrátit?','1');if(qty===null)return;const n=Number(qty.replace(',','.'));if(!Number.isFinite(n)||n<=0){alert('Neplatné množství.');return}try{const r=await api('movePersonal',{code,qty:n,direction});document.getElementById('searchResult').innerHTML=renderItem(r);await loadMine();}catch(e){alert('Pohyb se nepodařil: '+e.message)}}
async function loadMine(){try{const r=await api('myStock');if(!r.rows.length){document.getElementById('mineResult').innerHTML='<p class="muted">Nemáš u sebe žádný materiál.</p>';return}document.getElementById('mineResult').innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Kód</th><th>Položka</th><th>Stav</th><th></th></tr></thead><tbody>'+r.rows.map(x=>`<tr><td><strong>${esc(x.kod)}</strong></td><td>${esc(itemText(x))}</td><td>${num(x.pocet)} ${esc(x.jednotka)}${Number(x.celkemCt)>0?' · '+num(x.celkemCt)+' ct':''}</td><td><button class="small secondary" onclick="document.getElementById('searchCode').value='${esc(x.kod)}';document.querySelector('[data-tab=search]').click();searchItem()">Otevřít</button></td></tr>`).join('')+'</tbody></table></div>'}catch(e){document.getElementById('mineResult').innerHTML=`<div class="error-box">${esc(e.message)}</div>`}}
function tabs(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('tab-'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='mine')loadMine()})}
(async()=>{me=await requireAuth('WORKER');if(!me)return;document.getElementById('who').textContent=me.name+' · WORKER';document.getElementById('conn').textContent='Připojeno';document.getElementById('conn').className='badge good';tabs();loadMine()})();
</script></body></html>
